# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🐱 Kitty Configuration
#  Theme: Monokai Pro Spectrum (Breeze Dark)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━


# ━━━ Fonts ━━━
# Install: sudo dnf install jetbrains-mono-fonts
# Or Nerd Font version for icons
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        11.0

# Disable ligatures: never, always, cursor (only at cursor)
disable_ligatures cursor


# ━━━ Appearance ━━━
background_opacity     0.95
dim_opacity            0.80
window_padding_width   10
hide_window_decorations no

# Cursor
cursor_shape           beam
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines       10000

# Scrollbar (wider for touchscreen usability)
scrollbar              always
scrollbar_width        1.0
scrollbar_hover_width  1.5
scrollbar_jump_on_click yes

# Bell
enable_audio_bell      no
visual_bell_duration   0.1
window_alert_on_bell   yes
bell_on_tab            "🔔 "


# ━━━ Tab Bar ━━━
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_min_tabs       1
# Show the basename for path-style titles, so sibling repos stay distinct
# (~/Repositories/Scripts-and-Notebooks -> Scripts-and-Notebook)
tab_title_template     " {index}: {title.rpartition('/')[2][:20] if title[:1] in ('~','/') else title[:20]} "
active_tab_font_style  bold
tab_bar_margin_width   4.0
tab_bar_margin_height  4.0 0.0


# ━━━ Window Layout ━━━
enabled_layouts        tall,fat,stack,grid,splits,horizontal,vertical
window_border_width    1pt
draw_minimal_borders   yes
inactive_text_alpha    0.8

# New windows/tabs open in current directory
map ctrl+alt+enter     new_window_with_cwd
map ctrl+alt+w         close_window
map ctrl+shift+t       new_tab_with_cwd


# ━━━ Keyboard Shortcuts ━━━
# Layouts
map ctrl+alt+n         next_layout
map ctrl+alt+t         goto_layout tall
map ctrl+alt+s         goto_layout stack
map ctrl+alt+g         goto_layout grid

# Window navigation
map ctrl+shift+h       neighboring_window left
map ctrl+shift+l       neighboring_window right
map ctrl+shift+k       neighboring_window up
map ctrl+shift+j       neighboring_window down

# Window resizing
map ctrl+shift+left    resize_window narrower
map ctrl+shift+right   resize_window wider
map ctrl+shift+up      resize_window taller
map ctrl+shift+down    resize_window shorter

# Zoom current window (toggle)
map ctrl+shift+z       toggle_layout stack

# Font size
map ctrl+plus          change_font_size all +1.0
map ctrl+minus         change_font_size all -1.0
map ctrl+0             change_font_size all 0

# URL hints (open URLs with keyboard)
map ctrl+shift+e       open_url_with_hints

# Sessions: save/restore the whole workspace (tabs, cwds, layouts, running progs)
# At the prompt type just a NAME (e.g. 'work') -> ~/.config/kitty/sessions/work.kitty-session
# Do NOT type a directory with a trailing slash: kitty treats it as a filename.
map ctrl+shift+f4      save_as_session --use-foreground-process --base-dir ~/.config/kitty/sessions
# Must name the directory: kitty scans no default location, so a bare
# goto_session would open an EMPTY picker on a fresh start.
map ctrl+shift+f9      goto_session ~/.config/kitty/sessions

# Marks: highlight patterns in the scrollback, using the mark1/2/3 theme colors.
# Regex specs MUST be single-quoted: kitty runs the spec through shlex, which
# otherwise strips the backslashes (\berror\b silently becomes berrorb).
map ctrl+shift+m>e     toggle_marker iregex 1 '\berror\b' 2 '\bwarn' 3 '\bfail'
map ctrl+shift+m>c     remove_marker
map ctrl+shift+m>n     scroll_to_mark next
map ctrl+shift+m>p     scroll_to_mark prev

# Tab navigation (ctrl+shift+1..9 go to WINDOWS, not tabs)
map ctrl+shift+space   select_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Copy output of last command
map ctrl+shift+g       show_last_command_output


# ━━━ Mouse ━━━
copy_on_select         yes
mouse_hide_wait        3.0
url_style              curly

# Right-click paste disabled (was annoying with text selection)
# mouse_map right press ungrabbed paste_from_selection


# ━━━ Clipboard (standard Ctrl+C/V like other apps) ━━━
map ctrl+c             copy_or_interrupt
map ctrl+v             paste_from_clipboard


# ━━━ Performance ━━━
repaint_delay          10
input_delay            3
sync_to_monitor        yes


# ━━━ Shell Integration ━━━
shell_integration      enabled


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨 THEME: Monokai Pro Spectrum (Breeze Dark)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Core colors
foreground              #f7f1ff
background              #232629
selection_foreground    #ffffff
selection_background    #525053

# Cursor
cursor                  #f7f1ff
cursor_text_color       #232629

# URL underline color
url_color               #5ad4e6

# Window borders
active_border_color     #fc618d
inactive_border_color   #525053
bell_border_color       #fd9353

# Tab bar colors
active_tab_foreground   #232629
active_tab_background   #fc618d
inactive_tab_foreground #bab6c0
inactive_tab_background #363537
tab_bar_background      none

# Marks
mark1_foreground        #232629
mark1_background        #5ad4e6
mark2_foreground        #232629
mark2_background        #948ae3
mark3_foreground        #232629
mark3_background        #7bd88f

# Black
color0                  #232629
color8                  #69676c

# Red (Monokai pink)
color1                  #fc618d
color9                  #fc618d

# Green
color2                  #7bd88f
color10                 #7bd88f

# Yellow
color3                  #fce566
color11                 #fce566

# Blue (Monokai cyan)
color4                  #5ad4e6
color12                 #5ad4e6

# Magenta (Monokai purple)
color5                  #948ae3
color13                 #948ae3

# Cyan (Monokai orange)
color6                  #fd9353
color14                 #fd9353

# White
color7                  #bab6c0
color15                 #f7f1ff
map shift+enter send_text all \e\r
