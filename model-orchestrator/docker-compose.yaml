# Local demo stack: the router in front of fake model backends, with Postgres
# and the admin website. No GPU, no real model, nothing leaves this machine.
#
#   podman compose up --build -d      # or podman-compose, or docker compose
#   podman compose logs -f router
#   podman compose down -v            # stop, and delete the demo database
#
#   http://127.0.0.1:8600   admin website: user "admin", password "demo-password-123"
#   http://127.0.0.1:8090   the API (create a key in the admin website first)
#   http://127.0.0.1:9095   the router's internal port: /metrics and detailed /health
#
# README.md, "Quick start", walks through it. Everything is published on
# 127.0.0.1 only. If a port is taken, pick another one:
#
#   DEMO_ROUTER_PORT=18090 DEMO_ADMIN_PORT=18600 DEMO_METRICS_PORT=19095 podman compose up --build -d
#
# The passwords in this file are for the demo. Do not reuse them.

name: model-orchestrator-demo

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: demo-only
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U orchestrator -d orchestrator"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Stand-ins for vLLM, TEI, a reranker, Whisper and Kokoro on ports 9001-9007
  # (scripts/demo_backends.py). Reachable only from inside the stack.
  backends:
    build:
      context: .
      dockerfile: demo/backends.Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  router:
    build: .
    environment:
      ROUTER_DATABASE_URL: postgresql://orchestrator:demo-only@db:5432/orchestrator
      ROUTER_CONFIG: /etc/model-orchestrator/config.yaml
    volumes:
      # The directory, not the file: an edit of demo/config.yaml reloads the
      # router without a restart. ":z" lets the container read it under SELinux.
      - ./demo:/etc/model-orchestrator:ro,z
    depends_on:
      db:
        condition: service_healthy
      backends:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_ROUTER_PORT:-8090}:8090"
      # Internal port. Published here, on loopback, so the demo can show it.
      # A real deployment does not publish it.
      - "127.0.0.1:${DEMO_METRICS_PORT:-9095}:9095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/livez', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  admin-web:
    build: ./admin_web
    environment:
      ADMIN_DATABASE_URL: postgresql://orchestrator:demo-only@db:5432/orchestrator
      ADMIN_ROUTER_URL: http://router:8090
      ADMIN_LOCAL_USER: admin
      # At least 12 characters, or the website does not start.
      ADMIN_LOCAL_PASSWORD: demo-password-123
      # Reached directly, with no proxy in front: do not believe X-Forwarded-*.
      # The website warns at start about plain HTTP and the missing session
      # secret. That is expected here, on loopback, and wrong anywhere else.
      ADMIN_TRUST_PROXY_HEADERS: "off"
    depends_on:
      # The router applies the migrations; the website only uses the tables
      # and shows "schema not initialised" until they are there.
      router:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_ADMIN_PORT:-8600}:8600"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/livez', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
