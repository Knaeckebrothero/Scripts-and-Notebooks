# Model Orchestrator: example route config.
#
# Copy it, replace the routes with your own, and check the result before you
# deploy it:
#
#   python -m model_orchestrator check-config config.yaml
#
# The image ships this file as /app/config.yaml so that it starts on its own.
# Mount your config over it, or point ROUTER_CONFIG at another path. Every
# backend below is made up and sits on 127.0.0.1.
#
# Not in this file:
#   - API keys. They live in Postgres (ROUTER_DATABASE_URL) and are managed in
#     the admin website. An empty key table rejects every request.
#   - Secrets. A route names an environment variable (backend_api_key_env);
#     the value comes from the router's environment.
#   - Ports, timeouts, probe intervals, connection and concurrency limits,
#     log format: environment variables, listed in README.md.
#
# Which model ids a route answers to:
#   1. The aliases in its `models:` list. The request's `model` is rewritten
#      to `backend_model_name` before it is forwarded.
#   2. Every id the backend lists in its own /v1/models. Those are forwarded
#      as the client sent them.
# An alias wins over a discovered id. Two routes must not share an alias or a
# name, and unknown keys are errors, so a typo cannot be silently ignored.
#
# The router re-reads this file when it changes and on SIGHUP. An invalid file
# is rejected and the running config stays in place.

# Only `host` is read, and only at start. ROUTER_HOST overrides it. The port is
# ROUTER_PORT (default 8090); a `port:` key here is accepted and ignored.
server:
  host: "0.0.0.0"

routes:
  # ---- chat, with request defaults ---------------------------------------
  - name: "Reasoner-27B"                  # used in key allowlists, usage and logs
    type: "chat"                          # chat | vision | embedding | reranker | stt | tts
    backend: "http://127.0.0.1:8001"      # base URL of the model server
    endpoint: "/v1/chat/completions"      # path on that server
    backend_model_name: "example-org/reasoner-27b-it"   # the server's own name for the model
    models:                               # aliases clients may use
      - "reasoner-27b"
      - "reasoner"
    owned_by: "example-org"               # shown as owned_by in /v1/models
    # Merged into the request body before forwarding, for things a backend
    # needs on every request and has no server-side default for. A value the
    # client sends always wins. A mapping (chat_template_kwargs below) is
    # merged key by key, so the client can set one key and keep the others.
    request_defaults:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true
    # Seconds to wait for the backend before answering 504. Overrides the
    # endpoint's default (600 for chat, see README.md) for this route only.
    timeout_s: 900

  # ---- chat, a pool of two backends ----------------------------------------
  # `backend` takes one URL or a list. With a list, requests alternate between
  # the servers. A server that cannot be reached, drops the connection or
  # answers 5xx is skipped for a while, and that request is tried once more on
  # the other server. Every server of a pool must serve the same model.
  - name: "Chat-Pool"
    type: "chat"
    backend:
      - "http://127.0.0.1:8002"
      - "http://127.0.0.1:8003"
    endpoint: "/v1/chat/completions"
    backend_model_name: "example-org/chat-12b"
    models:
      - "chat-12b"
      - "chat"
    owned_by: "example-org"

  # ---- vision (same endpoint as chat) --------------------------------------
  - name: "Vision-12B"
    type: "vision"
    backend: "http://127.0.0.1:8004"
    endpoint: "/v1/chat/completions"
    backend_model_name: "example-org/vision-12b"
    models:
      - "vision-12b"
    owned_by: "example-org"
    # To count tokens of streamed answers the router asks the backend for the
    # usage event (stream_options.include_usage) and keeps that event from
    # clients that did not ask for it. Set this to false only for a backend
    # that rejects the option; its streamed requests are then counted without
    # tokens. Default: true.
    usage_from_stream: false

  # ---- embeddings ----------------------------------------------------------
  - name: "Embed-Large"
    type: "embedding"
    backend: "http://127.0.0.1:8005"
    endpoint: "/v1/embeddings"
    backend_model_name: "example-org/embed-large"
    models:
      - "embed-large"
      - "text-embedding-3-large"          # an alias can mimic a well-known id
    owned_by: "example-org"
    # The path the router probes every ROUTER_HEALTH_INTERVAL seconds. Any
    # answer below HTTP 500 counts as up. "/health" is the default, written
    # out here; the reranker below shows another path.
    health_path: "/health"

  # ---- rerank --------------------------------------------------------------
  - name: "Rerank-Base"
    type: "reranker"
    backend: "http://127.0.0.1:8006"
    endpoint: "/v1/rerank"
    backend_model_name: "example-org/rerank-base"
    models:
      - "rerank-base"
    owned_by: "example-org"
    health_path: "/ping"

  # ---- speech-to-text ------------------------------------------------------
  # `health_path: null` means: do not probe. The route then always counts as
  # available. Use it for servers without a health endpoint.
  - name: "Whisper-Large"
    type: "stt"
    backend: "http://127.0.0.1:8007"
    endpoint: "/v1/audio/transcriptions"
    backend_model_name: "whisper-large-v3"
    models:
      - "whisper-large-v3"
      - "whisper-1"
    owned_by: "example-org"
    health_path: null

  # ---- text-to-speech ------------------------------------------------------
  # GET /v1/audio/voices is forwarded to the first tts route, or to the one
  # named with ?model=<alias>.
  - name: "Speech-82M"
    type: "tts"
    backend: "http://127.0.0.1:8008"
    endpoint: "/v1/audio/speech"
    backend_model_name: "speech-82m"
    models:
      - "speech-82m"
      - "tts-1"
    owned_by: "example-org"
    health_path: null

  # ---- a backend behind a proxy, with its own API key ----------------------
  - name: "Tunnel-Chat"
    type: "chat"
    backend: "http://127.0.0.1:8009"
    endpoint: "/v1/chat/completions"
    backend_model_name: "example-org/tunnel-chat-8b"
    models:
      - "tunnel-chat"
    owned_by: "example-org"
    # Requests and health probes for this route go through this proxy:
    # socks5h:// (the proxy resolves the host name), socks5://, http:// or
    # https://. The backend address is then the one the proxy can reach.
    proxy: "socks5h://127.0.0.1:1080"
    # Name of an environment variable. Its value is sent to the backend as
    # "Authorization: Bearer <value>". The client's own key is never forwarded.
    # If the variable is unset the route still loads, with a warning.
    backend_api_key_env: "TUNNEL_CHAT_API_KEY"

# ---- another router as an upstream -------------------------------------------
# Every model id the other router lists becomes usable here, without copying
# its route list. Requests go to the same path on the upstream, with the
# upstream key; `model` is not rewritten and no request_defaults apply. Local
# routes win over upstream ids.
#
# upstreams:
#   - name: "site-a"
#     base_url: "http://127.0.0.1:8091"       # the other router
#     api_key_env: "SITE_A_ROUTER_API_KEY"    # a key of that router, from the environment
#     health_path: "/livez"                   # default; null = do not probe
#     include: ["*"]                          # globs of model ids to take over (default: all)
#     exclude: []                             # globs of model ids to leave out
#     discovery_interval: 60                  # seconds between /v1/models calls (default)
#     proxy: null                             # as on a route
#     tls_verify: true                        # for an https base_url
#     ca_file: null                           # CA bundle for an https base_url
