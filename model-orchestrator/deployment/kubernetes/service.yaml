apiVersion: v1
kind: Service
metadata:
  name: model-orchestrator
  namespace: model-orchestrator
  labels:
    app.kubernetes.io/name: model-orchestrator
spec:
  selector:
    app.kubernetes.io/name: model-orchestrator
  # The API only. The internal port (9095: metrics, detailed health) is left
  # out on purpose; Prometheus scrapes the pod directly (see the annotations
  # in deployment.yaml).
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  type: ClusterIP
