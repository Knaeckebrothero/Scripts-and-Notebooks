apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-orchestrator
  namespace: model-orchestrator
  labels:
    app.kubernetes.io/name: model-orchestrator
spec:
  # One replica, on purpose: the rate limiter, the concurrency counters and
  # the health state live in the router's memory. A second replica would give
  # every key twice its limits. For the same reason the old pod is stopped
  # before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-orchestrator
      annotations:
        # For a Prometheus that discovers pods by annotation. The metrics port
        # has no auth and shows backend URLs and key names: scrape it from
        # inside the cluster, and never put it behind the Service or Ingress.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9095"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          # Pin what you deploy: a release (vX.Y.Z) or a build of main
          # (sha-<short>). `latest` only moves on a release tag, but a pinned
          # tag is what makes a rollout a reviewed change.
          image: ghcr.io/knaeckebrothero/model-orchestrator:v3.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ROUTER_CONFIG
              value: "/etc/model-orchestrator/config.yaml"
            - name: ROUTER_LOG_FORMAT
              value: "json"
            # See terminationGracePeriodSeconds at the end of this file.
            # - name: ROUTER_SHUTDOWN_GRACE_SECONDS
            #   value: "50"
            # Postgres 16 or 17. The router creates and migrates its tables.
            - name: ROUTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: model-orchestrator-keys
                  key: database-url
            # One entry per route that sets backend_api_key_env in the config:
            # - name: TUNNEL_CHAT_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: model-orchestrator-keys
            #       key: tunnel-chat-api-key
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            # Internal: Prometheus metrics and the detailed health view.
            - name: metrics
              containerPort: 9095
              protocol: TCP
          volumeMounts:
            # The whole ConfigMap as a directory, not one file with subPath: a
            # subPath mount never sees an update, a directory mount does, and
            # the router then reloads the config by itself.
            - name: config
              mountPath: /etc/model-orchestrator
              readOnly: true
            # Uploads above 1 MB (speech-to-text) are spooled to /tmp.
            - name: tmp
              mountPath: /tmp
          # /livez answers as long as the process runs. It touches neither the
          # database nor a backend, so an outage elsewhere never restarts the
          # router. /health is for people and dashboards, not for the kubelet.
          # The start waits up to 60 s for Postgres, applies migrations and
          # probes every backend once before the port opens.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              # Request bodies are held in memory (up to ROUTER_MAX_BODY_MB,
              # default 200, per request).
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: model-orchestrator-config
        - name: tmp
          emptyDir: {}
      # Has to be longer than ROUTER_SHUTDOWN_GRACE_SECONDS (default 8): on
      # SIGTERM the router gives requests in flight that long and then ends
      # them with an answer. To give long requests more time, raise both
      # together, for example ROUTER_SHUTDOWN_GRACE_SECONDS=50 in `env` above
      # and 60 here.
      terminationGracePeriodSeconds: 30
