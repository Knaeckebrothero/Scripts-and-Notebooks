apiVersion: v1
kind: ConfigMap
metadata:
  name: model-orchestrator-config
  namespace: model-orchestrator
  labels:
    app.kubernetes.io/name: model-orchestrator
data:
  # The route config. No keys and no secrets in it: API keys live in Postgres,
  # backend keys come from the Secret through an environment variable.
  # Schema and every option: ../../config.example.yaml
  #
  # Check a change before you apply it:
  #   python -m model_orchestrator check-config config.yaml
  #
  # The Deployment mounts this ConfigMap as a directory. After `kubectl apply`
  # the kubelet updates the file (this can take a minute) and the router
  # reloads it without a restart. An invalid config is rejected: the running
  # one stays, the router logs why, and router_config_reloads_total{result="error"}
  # goes up.
  config.yaml: |
    routes:
      # A chat backend running as a Service in the cluster.
      - name: "Chat-12B"
        type: "chat"
        backend: "http://vllm-chat.models.svc.cluster.local:8000"
        endpoint: "/v1/chat/completions"
        backend_model_name: "example-org/chat-12b"
        models:
          - "chat-12b"
        owned_by: "example-org"

      # An embedding backend.
      - name: "Embed-Large"
        type: "embedding"
        backend: "http://tei-embed.models.svc.cluster.local:8080"
        endpoint: "/v1/embeddings"
        backend_model_name: "example-org/embed-large"
        models:
          - "embed-large"
        owned_by: "example-org"
